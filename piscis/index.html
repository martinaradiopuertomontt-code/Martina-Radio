
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piscis — El Diván de Mike</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: #eee9df;
  font-family: Arial, sans-serif;
  background: radial-gradient(
    ellipse at 50% 0%,
    #34434a,
    #191e22 55%,
    #101214
  );
  min-height: 100vh;
}

main {
  width: min(100% - 28px, 850px);
  margin: auto;
  padding: 30px 0 45px;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

header h1 {
  font: normal clamp(29px, 6vw, 43px) Georgia, serif;
  letter-spacing: 1px;
  margin: 0;
}

header p {
  font-size: 10px;
  letter-spacing: 4px;
  color: #c8ad7b;
}

.album {
  text-align: center;
  padding: 20px 14px;
  background: #ffffff08;
  border: 1px solid #c6aa7333;
  border-radius: 18px;
  box-shadow: 0 18px 45px #0005;
}

.cover {
  display: block;
  width: min(76vw, 330px);
  height: auto;
  aspect-ratio: 1;
  object-fit: cover;
  margin: auto;
  border-radius: 9px;
  cursor: pointer;
  box-shadow: 0 12px 30px #0006;
  transition: transform .25s, box-shadow .25s;
}

.cover:hover {
  transform: scale(1.025);
  box-shadow: 0 15px 38px #0009;
}

.cover:active {
  transform: scale(.97);
}

h2 {
  font: normal 28px Georgia, serif;
  margin: 20px 0 6px;
}

.subtitle {
  font-size: 13px;
  color: #aaa69e;
  margin-bottom: 20px;
}

/* REPRODUCTOR PERSONALIZADO: MISMAS DIMENSIONES */

.custom-player {
  width: 100%;
  height: 180px;
  box-sizing: border-box;
  padding: 17px 22px;
  border-radius: 10px;
  background: linear-gradient(135deg, #292d30, #171a1c);
  border: 1px solid #b99a62;
  box-shadow: inset 0 1px 0 #ffffff12, 0 5px 16px #0005;
  color: #eee9df;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-family: Arial, sans-serif;
}

.player-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.player-label {
  color: #c8ad7b;
  font-size: 10px;
  letter-spacing: 3px;
}

.player-status {
  color: #aaa69e;
  font-size: 10px;
}

.player-center {
  display: flex;
  align-items: center;
  gap: 17px;
}

.play-button {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border: 1px solid #c8ad7b;
  border-radius: 50%;
  background: linear-gradient(145deg, #c8ad7b, #987849);
  color: #191b1d;
  font-size: 21px;
  cursor: pointer;
  box-shadow: 0 3px 12px #0006;
  transition: transform .2s;
}

.play-button:hover {
  transform: scale(1.06);
}

.track-info {
  flex: 1;
  min-width: 0;
  text-align: left;
}

.track-name {
  font: normal 19px Georgia, serif;
  color: #f0e6d3;
}

.track-description {
  font-size: 11px;
  color: #aaa69e;
  margin-top: 5px;
}

.equalizer {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 25px;
}

.equalizer span {
  width: 3px;
  height: 5px;
  background: #c8ad7b;
  border-radius: 3px;
}

.equalizer.playing span {
  animation: equalize .65s ease-in-out infinite alternate;
}

.equalizer.playing span:nth-child(2n) {
  animation-delay: .2s;
}

.equalizer.playing span:nth-child(3n) {
  animation-delay: .4s;
}

.equalizer.playing span:nth-child(4n) {
  animation-delay: .1s;
}

@keyframes equalize {
  from { height: 5px; }
  to { height: 23px; }
}

.player-progress {
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-progress input {
  flex: 1;
  min-width: 0;
  accent-color: #c8ad7b;
  cursor: pointer;
}

.player-time {
  color: #aaa69e;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.library {
  margin-top: 34px;
}

.library h3 {
  text-align: center;
  font: normal 23px Georgia, serif;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.album-card {
  padding: 9px;
  background: #ffffff08;
  border: 1px solid #ffffff12;
  border-radius: 12px;
  text-align: center;
}

.album-card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 8px;
  display: block;
  transition: transform .25s;
}

.album-card img:hover {
  transform: scale(1.025);
}

.album-card strong {
  display: block;
  padding: 10px 2px 3px;
  font-size: 13px;
  font-weight: normal;
}

footer {
  text-align: center;
  color: #777a79;
  font-size: 11px;
  margin-top: 32px;
}

@media (min-width: 650px) {
  main {
    padding-top: 45px;
  }

  .grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .album {
    padding: 30px;
  }
}

@media (max-width: 420px) {
  .custom-player {
    padding: 16px 13px;
  }

  .player-center {
    gap: 12px;
  }

  .player-label {
    letter-spacing: 2px;
  }

  .track-name {
    font-size: 17px;
  }
}
</style>
</head>

<body>
<main>

<header>
  <h1>El Diván de Mike</h1>
  <p>MÚSICA PARA SENTIR</p>
</header>

<section class="album">

  <img
    class="cover"
    src="https://raw.githubusercontent.com/martinaradiopuertomontt-code/Martina-Radio/main/piscis/2026-10-19%20142619.png"
    alt="Carátula original del álbum Piscis"
  >

  <h2>Piscis</h2>
  <div class="subtitle">Álbum completo</div>

  <div class="custom-player">

    <div class="player-top">
      <span class="player-label">EL DIVÁN DE MIKE</span>
      <span class="player-status" id="playerStatus">LISTO PARA ESCUCHAR</span>
    </div>

    <div class="player-center">

      <button class="play-button" id="playButton"
        type="button" aria-label="Reproducir">▶</button>

      <div class="track-info">
        <div class="track-name">Piscis</div>
        <div class="track-description">
          Álbum completo · Reproducción continua
        </div>
      </div>

      <div class="equalizer" id="equalizer">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span>
      </div>

    </div>

    <div class="player-progress">
      <span class="player-time" id="currentTime">0:00</span>
      <input type="range" id="progressBar"
        min="0" max="1000" value="0">
      <span class="player-time" id="duration">0:00</span>
    </div>

    <audio id="albumAudio" preload="metadata">
      <source
        src="https://drive.google.com/uc?export=download&id=1EAAFaqAkaKW_KiUizEOv2vEddsYGZ5tY"
        type="audio/mpeg">
    </audio>

  </div>

</section>

<section class="library">
  <h3>Mis álbumes</h3>

  <div class="grid">
    <div class="album-card">
      <img
        src="https://raw.githubusercontent.com/martinaradiopuertomontt-code/Martina-Radio/main/piscis/2026-10-19%20142619.png"
        alt="Piscis"
      >
      <strong>Piscis</strong>
    </div>
  </div>
</section>

<footer>© El Diván de Mike</footer>

</main>

<script>
const audio = document.getElementById("albumAudio");
const playButton = document.getElementById("playButton");
const progressBar = document.getElementById("progressBar");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const statusText = document.getElementById("playerStatus");
const equalizer = document.getElementById("equalizer");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return min + ":" + String(sec).padStart(2, "0");
}

playButton.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      statusText.textContent = "NO SE PUDO CARGAR EL AUDIO";
    }
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  playButton.textContent = "Ⅱ";
  playButton.setAttribute("aria-label", "Pausar");
  statusText.textContent = "REPRODUCIENDO";
  equalizer.classList.add("playing");
});

audio.addEventListener("pause", () => {
  playButton.textContent = "▶";
  playButton.setAttribute("aria-label", "Reproducir");
  statusText.textContent = "EN PAUSA";
  equalizer.classList.remove("playing");
});

audio.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  currentTime.textContent = formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    progressBar.value =
      (audio.currentTime / audio.duration) * 1000;
  }
});

progressBar.addEventListener("input", () => {
  if (Number.isFinite(audio.duration)) {
    audio.currentTime =
      (progressBar.value / 1000) * audio.duration;
  }
});

audio.addEventListener("ended", () => {
  statusText.textContent = "ÁLBUM FINALIZADO";
  playButton.textContent = "▶";
  equalizer.classList.remove("playing");
});

audio.addEventListener("error", () => {
  statusText.textContent = "ERROR AL CARGAR EL AUDIO";
});
</script>

</body>
</html>
