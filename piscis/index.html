<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piscis | El Diván de Mike</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: #eee9df;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at top, #26343a 0%, transparent 60%),
    linear-gradient(145deg, #101519, #202326 60%, #111315);
}

main {
  width: min(100% - 28px, 850px);
  margin: auto;
  padding: 35px 0 50px;
}

header {
  text-align: center;
  margin-bottom: 32px;
}

header h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: clamp(27px, 6vw, 42px);
  font-weight: normal;
  letter-spacing: 2px;
}

header p {
  color: #bca77e;
  font-size: 11px;
  letter-spacing: 4px;
}

.album {
  text-align: center;
  padding: 24px 18px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(213,190,145,.18);
  border-radius: 18px;
  box-shadow: 0 18px 50px #0005;
}

.cover {
  width: min(72vw, 330px);
  aspect-ratio: 1;
  margin: auto;
  border-radius: 10px;
  background: linear-gradient(145deg, #303b40, #15191c);
  border: 1px solid #887957;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d7c39b;
  font-family: Georgia, serif;
  font-size: 27px;
  letter-spacing: 4px;
  transition: transform .25s, box-shadow .25s;
  cursor: pointer;
}

.cover:active {
  transform: scale(.97);
}

h2 {
  font-family: Georgia, serif;
  font-size: 26px;
  font-weight: normal;
  margin: 22px 0 5px;
}

.subtitle {
  color: #aaa69e;
  font-size: 13px;
  margin-bottom: 22px;
}

.player {
  width: 100%;
  display: block;
  border-radius: 10px;
}

.library {
  margin-top: 35px;
}

.library h3 {
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: normal;
  text-align: center;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.album-card {
  padding: 10px;
  background: #ffffff08;
  border: 1px solid #ffffff12;
  border-radius: 12px;
  text-align: center;
  color: #eee9df;
}

.mini-cover {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #354047, #171a1d);
  border-radius: 8px;
  color: #cdb78b;
  font-family: Georgia, serif;
  font-size: 20px;
  transition: transform .25s;
}

.album-card:active .mini-cover {
  transform: scale(.96);
}

.album-card strong {
  display: block;
  padding: 11px 2px 3px;
  font-size: 13px;
  font-weight: normal;
}

footer {
  text-align: center;
  color: #777a79;
  font-size: 11px;
  margin-top: 35px;
}

@media (min-width: 650px) {
  main { padding-top: 50px; }
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .album { padding: 32px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>El Diván de Mike</h1>
    <p>MÚSICA PARA SENTIR</p>
  </header>

  <section class="album">
    <div class="cover" aria-label="Portada del álbum Piscis">
      PISCIS
    </div>
    <h2>Piscis</h2>
    <div class="subtitle">Álbum completo</div>

    <iframe
      class="player"
      id="musicPlayer"
      title="Reproductor del álbum Piscis"
      src="about:blank"
      height="120"
      allow="autoplay"
      frameborder="0">
    </iframe>
  </section>

  <section class="library">
    <h3>Mis álbumes</h3>
    <div class="grid">
      <div class="album-card">
        <div class="mini-cover">01</div>
        <strong>Piscis</strong>
      </div>
    </div>
  </section>

  <footer>© El Diván de Mike</footer>
</main>
</body>
</html>
