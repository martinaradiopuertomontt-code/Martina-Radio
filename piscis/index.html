<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piscis | El Diván de Mike</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#eee9df;
 font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at 50% 0%,#34434a,#191e22 55%,#101214);
}
main{width:min(100% - 28px,850px);margin:auto;padding:34px 0 45px}
header{text-align:center;margin-bottom:30px}
header h1{font:normal clamp(28px,6vw,43px) Georgia,serif;letter-spacing:1.5px;margin:0}
header p{font-size:10px;letter-spacing:4px;color:#c8ad7b}
.album{
 text-align:center;padding:24px 17px;
 background:#ffffff08;border:1px solid #c6aa7333;
 border-radius:18px;box-shadow:0 18px 45px #0005;
}
.cover{
 width:min(75vw,330px);aspect-ratio:1;margin:auto;
 border-radius:10px;background:linear-gradient(145deg,#3d4a50,#15191c);
 border:1px solid #a68b5d;display:flex;align-items:center;
 justify-content:center;color:#ddc69a;
 font:normal 29px Georgia,serif;letter-spacing:5px;
 transition:transform .25s,box-shadow .25s;cursor:pointer;
}
.cover:active{transform:scale(.97)}
h2{font:normal 27px Georgia,serif;margin:20px 0 5px}
.subtitle{font-size:13px;color:#aaa69e;margin-bottom:20px}
.player{display:block;width:100%;height:120px;border:0;border-radius:8px}
.library{margin-top:35px}
.library h3{text-align:center;font:normal 23px Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.album-card{padding:9px;background:#ffffff08;border:1px solid #ffffff12;border-radius:12px;text-align:center}
.mini-cover{
 aspect-ratio:1;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#354047,#171a1d);border-radius:8px;
 color:#cdb78b;font:normal 21px Georgia,serif;
}
.album-card strong{display:block;padding:10px 2px 3px;font-size:13px;font-weight:normal}
footer{text-align:center;color:#777a79;font-size:11px;margin-top:32px}
@media(min-width:650px){
 main{padding-top:48px}
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
 .album{padding:32px}
}
</style>
</head>
<body>
<main>
<header>
 <h1>El Diván de Mike</h1>
 <p>MÚSICA PARA SENTIR</p>
</header>

<section class="album">
 <div class="cover" title="Piscis">PISCIS</div>
 <h2>Piscis</h2>
 <div class="subtitle">Álbum completo</div>
 <iframe
  class="player"
  title="Escuchar el álbum Piscis"
  src="https://drive.google.com/file/d/1EAAFaqAkaKW_KiUizEOv2vEddsYGZ5tY/preview"
  allow="autoplay"
  allowfullscreen>
 </iframe>
</section>

<section class="library">
 <h3>Mis álbumes</h3>
 <div class="grid">
  <div class="album-card">
   <div class="mini-cover">01</div>
   <strong>Piscis</strong>
  </div>
 </div>
</section>

<footer>© El Diván de Mike</footer>
</main>
</body>
</html>
