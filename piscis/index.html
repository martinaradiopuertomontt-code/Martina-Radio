```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piscis — El Diván de Mike</title>

<style>
* {
  box-sizing: border-box;
}

html {
  width: 100%;
  overflow-x: hidden;
}

body {
  margin: 0;
  width: 100%;
  color: #eee9df;
  font-family: Arial, sans-serif;
  background: radial-gradient(
    ellipse at 50% 0%,
    #34434a,
    #191e22 55%,
    #101214
  );
  min-height: 100vh;
  overflow-x: hidden;
}

main {
  width: calc(100% - 28px);
  max-width: 850px;
  margin: auto;
  padding: 30px 0 45px;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

header h1 {
  font: normal clamp(29px, 6vw, 43px) Georgia, serif;
  letter-spacing: 1px;
  margin: 0;
}

header p {
  font-size: 10px;
  letter-spacing: 4px;
  color: #c8ad7b;
}

.album {
  width: 100%;
  min-width: 0;
  text-align: center;
  padding: 20px 14px;
  background: #ffffff08;
  border: 1px solid #c6aa7333;
  border-radius: 18px;
  box-shadow: 0 18px 45px #0005;
}

.cover {
  display: block;
  width: min(76vw, 330px);
  max-width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: cover;
  margin: auto;
  border-radius: 9px;
  cursor: pointer;
  box-shadow: 0 12px 30px #0006;
  transition: transform .25s, box-shadow .25s;
}

.cover:hover {
  transform: scale(1.025);
  box-shadow: 0 15px 38px #0009;
}

.cover:active {
  transform: scale(.97);
}

h2 {
  font: normal 28px Georgia, serif;
  margin: 20px 0 6px;
}

.subtitle {
  font-size: 13px;
  color: #aaa69e;
  margin-bottom: 20px;
}

/* Reproductor adaptable */
.player-wrap {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  border-radius: 10px;
  background: #fff;
}

.player-frame {
  display: block;
  width: 100%;
  max-width: 100%;
  height: 230px;
  border: 0;
  margin: 0;
  background: #fff;
}

/* Biblioteca de álbumes */
.library {
  margin-top: 34px;
}

.library h3 {
  text-align: center;
  font: normal 23px Georgia, serif;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.album-card {
  min-width: 0;
  padding: 9px;
  background: #ffffff08;
  border: 1px solid #ffffff12;
  border-radius: 12px;
  text-align: center;
}

.album-card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 8px;
  display: block;
  transition: transform .25s;
}

.album-card img:hover {
  transform: scale(1.025);
}

.album-card strong {
  display: block;
  padding: 10px 2px 3px;
  font-size: 13px;
  font-weight: normal;
}

footer {
  text-align: center;
  color: #777a79;
  font-size: 11px;
  margin-top: 32px;
}

/* Ajustes para celulares */
@media (max-width: 480px) {
  main {
    width: calc(100% - 20px);
    padding-top: 24px;
  }

  .album {
    padding: 18px 10px;
  }

  .player-wrap {
    width: 100%;
    border-radius: 8px;
  }

  .player-frame {
    width: 100%;
    height: 260px;
  }

  .cover {
    width: min(78vw, 330px);
  }

  h2 {
    font-size: 26px;
  }
}

/* Ajustes para pantallas grandes */
@media (min-width: 650px) {
  main {
    padding-top: 45px;
  }

  .grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .album {
    padding: 30px;
  }

  .player-frame {
    height: 230px;
  }
}
</style>
</head>

<body>
<main>

<header>
  <h1>El Diván de Mike</h1>
  <p>MÚSICA PARA SENTIR</p>
</header>

<section class="album">

  <img
    class="cover"
    src="https://raw.githubusercontent.com/martinaradiopuertomontt-code/Martina-Radio/main/piscis/2026-10-19%20142619.png"
    alt="Carátula original del álbum Piscis"
  >

  <h2>Piscis</h2>
  <div class="subtitle">Álbum completo</div>

  <div class="player-wrap">
    <iframe
      class="player-frame"
      title="Reproductor del álbum Piscis"
      src="https://drive.google.com/file/d/1EAAFaqAkaKW_KiUizEOv2vEddsYGZ5tY/preview"
      allow="autoplay"
      loading="eager">
    </iframe>
  </div>

</section>

<section class="library">
  <h3>Mis álbumes</h3>

  <div class="grid">
    <div class="album-card">
      <img
        src="https://raw.githubusercontent.com/martinaradiopuertomontt-code/Martina-Radio/main/piscis/2026-10-19%20142619.png"
        alt="Piscis"
      >
      <strong>Piscis</strong>
    </div>
  </div>
</section>

<footer>© El Diván de Mike</footer>

</main>
</body>
</html>
```
