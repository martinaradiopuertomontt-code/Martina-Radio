<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b4e">
  <meta name="description" content="Martina Radio, Siempre Para Ti. Música y recuerdos para acompañarte.">

  <title>Martina Radio — Siempre Para Ti ❤️</title>

  <style>
    :root {
      --azul: #12365c;
      --azul-oscuro: #091b30;
      --rosa: #f5a1c4;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--blanco);
      background-color: var(--azul-oscuro);
      background-image:
        linear-gradient(
          180deg,
          rgba(7, 22, 40, 0.48),
          rgba(7, 22, 40, 0.78)
        ),
        url("BANNER.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .pagina {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 22px;
      text-align: center;
    }

    .marca {
      margin-bottom: 24px;
    }

    .icono-martina {
      display: block;
      width: 78px;
      height: 78px;
      object-fit: contain;
      margin: 0 auto 10px;
      filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.3));
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.1;
      font-weight: 800;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
    }

    .marca p {
      margin: 10px 0 0;
      color: #ffd2e4;
      font-size: clamp(0.95rem, 2.5vw, 1.25rem);
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 2px 8px #000;
    }

    .radio {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .radio-antigua {
      display: block;
      width: min(100%, 410px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.4));
    }

    .panel {
      width: 100%;
      max-width: 540px;
      padding: 26px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      background: rgba(8, 26, 47, 0.88);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .etiqueta {
      color: var(--rosa);
      font-size: 0.76rem;
      font-weight: bold;
      letter-spacing: 1.6px;
      line-height: 1.6;
    }

    .cancion {
      display: flex;
      align-items: center;
      gap: 15px;
      text-align: left;
      margin: 23px 0 18px;
    }

    .caratula {
      display: grid;
      flex: 0 0 68px;
      width: 68px;
      height: 68px;
      place-items: center;
      border-radius: 14px;
      color: var(--blanco);
      font-size: 2.4rem;
      background: linear-gradient(145deg, #e98bb4, #355f94);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .artista {
      margin-bottom: 5px;
      color: #f6c6dc;
      font-size: 0.92rem;
    }

    .datos h2 {
      margin: 0;
      font-size: clamp(1.2rem, 4vw, 1.65rem);
    }

    .estado {
      min-height: 24px;
      margin: 18px 0;
      color: #f4f6fb;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .controles {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0;
    }

    .control {
      min-height: 48px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--blanco);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .control:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .control:active {
      transform: scale(0.97);
    }

    .control:focus-visible,
    .web:focus-visible {
      outline: 3px solid #ffd2e4;
      outline-offset: 4px;
    }

    .control.principal {
      border-color: var(--rosa);
      background: var(--rosa);
      color: #19283b;
    }

    .control.principal:hover {
      background: #ffc1d9;
    }

    .rotulo-volumen {
      display: block;
      margin-top: 22px;
      color: #f6c6dc;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: left;
    }

    .volumen {
      display: block;
      width: 100%;
      margin: 13px 0 0;
      accent-color: var(--rosa);
      cursor: pointer;
    }

    .web {
      display: inline-block;
      max-width: 100%;
      margin: 25px auto 0;
      padding: 14px 23px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      background: rgba(10, 33, 57, 0.75);
      color: var(--blanco);
      font-size: 0.94rem;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    .web:hover {
      background: rgba(245, 161, 196, 0.25);
    }

    footer {
      margin-top: 28px;
      color: #ffffff;
      font-size: 0.88rem;
      text-shadow: 0 2px 7px #000;
    }

    @media (min-width: 760px) {
      .pagina {
        padding-top: 36px;
      }

      .radio {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      .radio-antigua {
        width: 42%;
        max-width: 390px;
      }

      .panel {
        flex: 1;
        max-width: 500px;
      }
    }

    @media (max-width: 600px) {
      body {
        background-attachment: scroll;
      }

      .pagina {
        padding: 22px 15px 20px;
      }

      .icono-martina {
        width: 66px;
        height: 66px;
      }

      .marca p {
        letter-spacing: 2px;
      }

      .radio-antigua {
        width: min(92%, 340px);
      }

      .panel {
        padding: 22px 18px;
        border-radius: 18px;
      }

      .control {
        padding: 12px 16px;
      }

      .controles {
        gap: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">

    <header class="marca">
      <img
        class="icono-martina"
        src="descarga.jpg"
        alt="Logo de Martina Radio"
      >

      <h1>Martina Radio</h1>
      <p>SIEMPRE PARA TI ❤️</p>
    </header>

    <section class="radio" aria-label="Reproductor de Martina Radio">

      <img
        class="radio-antigua"
        src="be599127-6850-4bc5-9c95-e4b3fe142a10.png"
        alt="Radio antigua de madera con su mesita"
      >

      <div class="panel">
        <div class="etiqueta">MARTINA RADIO · LOS LAGOS, CHILE</div>

        <div class="cancion">
          <div class="caratula" aria-hidden="true">♫</div>

          <div class="datos">
            <div class="artista">Tu compañía de siempre</div>
            <h2>Siempre Para Ti</h2>
          </div>
        </div>

        <p class="estado" id="estado" aria-live="polite">
          Enciende la radio y disfruta de la música ❤️
        </p>

        <div class="controles">
          <button class="control principal" id="play" type="button">
            ▶ Escuchar en vivo
          </button>

          <button class="control" id="detener" type="button">
            ■ Parar
          </button>
        </div>

        <label class="rotulo-volumen" for="volumen">VOLUMEN</label>

        <input
          class="volumen"
          id="volumen"
          type="range"
          min="0"
          max="100"
          value="80"
          aria-label="Volumen de la radio"
        >

        <audio
          id="audio"
          preload="none"
          src="https://streaming04.xhost.cl/listen/martinaradio/radio.mp3">
        </audio>
      </div>

    </section>

    <a
      class="web"
      href="https://sites.google.com/view/martinaradio/inicio"
      target="_blank"
      rel="noopener noreferrer">
      🌐 ENTRAR A LA WEB ↗
    </a>

    <footer>Martina Radio · Siempre Para Ti ❤️</footer>

  </main>

  <script>
    const audio = document.getElementById("audio");
    const estado = document.getElementById("estado");
    const play = document.getElementById("play");
    const detener = document.getElementById("detener");
    const volumen = document.getElementById("volumen");

    audio.volume = Number(volumen.value) / 100;

    play.addEventListener("click", async () => {
      estado.textContent = "Conectando con Martina Radio...";
      audio.volume = Number(volumen.value) / 100;

      try {
        await audio.play();
        estado.textContent = "Estás escuchando Martina Radio en vivo ❤️";
        play.textContent = "♫ Escuchando";
      } catch (error) {
        estado.textContent =
          "No se pudo conectar. Comprueba tu conexión e inténtalo de nuevo.";
        play.textContent = "▶ Intentar nuevamente";
      }
    });

    detener.addEventListener("click", () => {
      audio.pause();
      audio.currentTime = 0;
      play.textContent = "▶ Escuchar en vivo";
      estado.textContent = "Reproducción detenida. Vuelve cuando quieras ❤️";
    });

    volumen.addEventListener("input", () => {
      audio.volume = Number(volumen.value) / 100;
    });

    audio.addEventListener("playing", () => {
      estado.textContent = "Estás escuchando Martina Radio en vivo ❤️";
      play.textContent = "♫ Escuchando";
    });

    audio.addEventListener("waiting", () => {
      estado.textContent = "Conectando con la señal... un momento.";
    });

    audio.addEventListener("error", () => {
      estado.textContent =
        "No se pudo cargar la señal. Pulsa Escuchar para intentarlo de nuevo.";
      play.textContent = "▶ Intentar nuevamente";
    });

    audio.addEventListener("pause", () => {
      if (audio.currentTime > 0 && !audio.ended) {
        play.textContent = "▶ Escuchar en vivo";
      }
    });
  </script>
</body>
</html>
