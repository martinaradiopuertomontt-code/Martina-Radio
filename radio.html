<style> :root { --blue: #123f83; --pink: #ff78b7; } * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; padding: 18px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Arial, sans-serif; color: white; background: linear-gradient(#061b3db8, #061b3db8), url("BANNER.png") center / cover fixed no-repeat, #102d56; } .panel { width: min(620px, 100%); text-align: center; padding: 24px clamp(14px, 4vw, 30px); border-radius: 22px; border: 1px solid #ffffff45; background: linear-gradient(145deg, #164b96f5, #092654f5); box-shadow: 0 16px 42px #0007; } .logo { width: 100px; height: 100px; object-fit: contain; } h1 { font-size: clamp(28px, 6vw, 38px); margin: 7px 0 3px; } .tagline { color: #ffd3e8; font-weight: bold; letter-spacing: 2px; margin: 0 0 20px; } .vinyl-area { display: flex; justify-content: center; margin: 15px 0 20px; } .vinyl { width: clamp(155px, 43vw, 220px); aspect-ratio: 1; border-radius: 50%; background: repeating-radial-gradient( circle at center, #17191e 0px, #252830 2px, #101115 4px, #30323a 5px, #101115 7px ); border: 5px solid #08090d; box-shadow: 0 8px 18px #0008; display: flex; align-items: center; justify-content: center; position: relative; } .vinyl::after { content: ""; position: absolute; inset: 12%; border-radius: 50%; border: 1px solid #ffffff16; pointer-events: none; } .vinyl.playing { animation: spin 3.5s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } .record-label { width: 39%; height: 39%; border-radius: 50%; overflow: hidden; background: #f4b8d4; border: 4px solid #e8d5e0; display: flex; align-items: center; justify-content: center; z-index: 1; } .record-label img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; } .track-title { font-weight: bold; margin: 8px 0 14px; overflow-wrap: anywhere; } .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin: 14px 0; } button { border: 0; border-radius: 25px; padding: 12px 17px; min-height: 43px; color: #17233b; background: var(--pink); font-size: 14px; font-weight: bold; cursor: pointer; } button.secondary { background: #ffffff20; color: white; border: 1px solid #ffffff45; } button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid white; outline-offset: 3px; } .progress-row { display: flex; align-items: center; gap: 10px; margin: 15px 0; font-size: 12px; color: #e2eaff; } input[type="range"] { width: 100%; min-width: 0; accent-color: var(--pink); cursor: pointer; } .program { text-align: left; margin-top: 22px; } label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; } select { width: 100%; padding: 13px; font-size: 16px; border-radius: 10px; border: none; color: #17345e; background: white; } #status { min-height: 2.8em; font-size: 13px; line-height: 1.5; color: #e3eaff; margin: 13px 0; overflow-wrap: anywhere; } .youtube-box { width: 320px; max-width: 100%; margin: 20px auto 0; border-radius: 10px; overflow: hidden; background: #050b16; aspect-ratio: 16 / 9; } #ytplayer { display: block; width: 100%; height: 100%; min-height: 180px; border: 0; } .note, footer { color: #d4e0f9; font-size: 11px; line-height: 1.5; } footer { text-align: center; margin-top: 14px; } @media (max-width: 420px) { body { padding: 8px 5px; background-attachment: scroll; } .panel { padding: 17px 11px; border-radius: 16px; } .controls { gap: 7px; } button { padding: 11px 10px; } } </style>

<body> <main class="panel"> <img class="logo" src="descarga.jpg" alt="Martina Radio" onerror="this.style.display='none'">

<script> "use strict"; let player = null; let ready = false; let programs = []; let currentIndex = 0; let dragging = false; let progressTimer = null; const selector = document.getElementById("playlist"); const status = document.getElementById("status"); const vinyl = document.getElementById("vinyl"); const progress = document.getElementById("progress"); const trackTitle = document.getElementById("trackTitle"); function say(message) { status.textContent = message; } function validId(id) { return typeof id === "string" && /^[A-Za-z0-9_-]{10,}$/.test(id) && !/PON_AQUI|REEMPLAZAR|EJEMPLO/i.test(id); } function clock(seconds) { if (!Number.isFinite(seconds) || seconds < 0) return "0:00"; const s = Math.floor(seconds); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); } async function loadConfig() { try { const response = await fetch( "playlist.json?cache=" + Date.now(), { cache: "no-store" } ); if (!response.ok) { throw new Error("No se pudo leer playlist.json"); } const config = await response.json(); programs = Array.isArray(config.programaciones) ? config.programaciones : []; selector.replaceChildren(); programs.forEach((item, index) => { const option = document.createElement("option"); option.value = String(index); option.textContent = item.nombre || "Programación " + (index + 1); selector.appendChild(option); }); const firstValid = programs.findIndex( item => validId(item.playlistId) ); if (firstValid === -1) { selector.disabled = true; say("Añade al menos un ID válido en playlist.json."); return; } const requestedIndex = Number(config.programacionInicial); currentIndex = Number.isInteger(requestedIndex) && requestedIndex >= 0 && requestedIndex < programs.length && validId(programs[requestedIndex]?.playlistId) ? requestedIndex : firstValid; selector.value = String(currentIndex); selector.disabled = false; if (ready) { choosePlaylist(false); } } catch (error) { console.error(error); say("No se pudo cargar playlist.json. Comprueba que esté junto a radio.html."); } } function choosePlaylist(autoplay) { const item = programs[currentIndex]; if (!ready || !player) { say("YouTube todavía está cargando."); return; } if (!item || !validId(item.playlistId)) { say("Esta sección todavía no tiene un ID real en playlist.json."); return; } trackTitle.textContent = item.nombre || "Martina Radio"; say("Cargando programación: " + item.nombre); try { player.loadPlaylist({ listType: "playlist", list: item.playlistId, index: 0 }); if (autoplay) { player.playVideo(); } } catch (error) { console.error(error); say("No se pudo solicitar la playlist. Inténtalo de nuevo."); } } window.onYouTubeIframeAPIReady = function() { player = new YT.Player("ytplayer", { width: "320", height: "200", playerVars: { playsinline: 1, controls: 1, rel: 0, origin: window.location.origin }, events: { onReady: function(event) { ready = true; // Mantiene una política de referencia explícita en el iframe. try { event.target.getIframe().referrerPolicy = "strict-origin-when-cross-origin"; } catch (error) { console.warn("No se pudo ajustar referrerPolicy.", error); } if (programs.length) { choosePlaylist(false); } else { say("Reproductor listo. Esperando las programaciones."); } }, onStateChange: function(event) { if (event.data === YT.PlayerState.PLAYING) { vinyl.classList.add("playing"); say("Sonando en Martina Radio"); updateProgress(); } else { vinyl.classList.remove("playing"); } if (event.data === YT.PlayerState.CUED || event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) { refreshTrackTitle(); } }, onError: function(event) { vinyl.classList.remove("playing"); const messages = { 2: "YouTube recibió un parámetro no válido. Revisa el ID de la playlist.", 5: "YouTube no pudo reproducir el video en este reproductor.", 100: "El video no está disponible o es privado.", 101: "El propietario no permite reproducir este video incrustado.", 150: "El propietario no permite reproducir este video incrustado.", 153: "YouTube no recibió la información de referencia del reproductor." }; say((messages[event.data] || "YouTube no pudo reproducir el contenido.") + " Código: " + event.data); } } }); }; function refreshTrackTitle() { if (!ready || !player) return; try { const data = player.getVideoData(); if (data && data.title) { trackTitle.textContent = data.title; } } catch (error) { // El título se actualizará cuando YouTube tenga los datos. } } selector.addEventListener("change", function() { currentIndex = Number(this.value); choosePlaylist(false); }); document.getElementById("play").addEventListener("click", function() { if (!ready || !player) { say("YouTube todavía está cargando."); return; } const item = programs[currentIndex]; if (!item || !validId(item.playlistId)) { say("Selecciona una programación que tenga un ID real."); return; } try { const currentPlaylist = player.getPlaylist(); if (currentPlaylist && currentPlaylist.length > 0) { player.playVideo(); } else { choosePlaylist(true); } } catch (error) { console.error(error); choosePlaylist(true); } }); document.getElementById("pause").addEventListener("click", function() { if (ready && player) player.pauseVideo(); }); document.getElementById("next").addEventListener("click", function() { if (ready && player) { player.nextVideo(); } }); progress.addEventListener("input", function() { dragging = true; }); progress.addEventListener("change", function() { if (ready && player && player.getDuration() > 0) { const target = (Number(progress.value) / 1000) * player.getDuration(); player.seekTo(target, true); } dragging = false; }); function updateProgress() { if (progressTimer !== null) { clearTimeout(progressTimer); } if (!ready || !player) return; try { if (player.getPlayerState() === YT.PlayerState.PLAYING) { const duration = player.getDuration(); const elapsed = player.getCurrentTime(); if (!dragging && duration > 0) { progress.value = String( Math.round((elapsed / duration) * 1000) ); } document.getElementById("elapsed").textContent = clock(elapsed); document.getElementById("duration").textContent = clock(duration); refreshTrackTitle(); } } catch (error) { console.warn("No se pudo actualizar el progreso.", error); } progressTimer = setTimeout(updateProgress, 1000); } loadConfig(); const script = document.createElement("script"); script.src = "https://www.youtube.com/iframe_api"; script.onerror = function() { say("No se pudo cargar el reproductor de YouTube. Comprueba tu conexión."); }; document.head.appendChild(script); </script>
