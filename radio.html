
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123f83">
<title>Martina Radio — Siempre Para Ti</title>

<style>
:root {
  --blue: #123f83;
  --deep: #061b3d;
  --pink: #ff78b7;
  --white: #fff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 14px;
  display: grid;
  place-items: center;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--white);
  text-align: center;
  background:
    linear-gradient(rgba(4,20,47,.55), rgba(4,20,47,.78)),
    url("BANNER.png") center / cover fixed no-repeat;
}

.panel {
  width: min(100%, 480px);
  padding: 28px 22px;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 26px;
  background: linear-gradient(
    155deg,
    rgba(18,63,131,.96),
    rgba(5,24,58,.97)
  );
  box-shadow: 0 18px 55px rgba(0,0,0,.42);
  backdrop-filter: blur(8px);
}

.logo {
  display: block;
  width: 88px;
  height: 88px;
  margin: 0 auto 12px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.65);
  box-shadow: 0 5px 18px rgba(0,0,0,.3);
}

h1 {
  margin: 8px 0 5px;
  font-size: clamp(29px, 7vw, 38px);
}

.slogan {
  margin: 0 0 24px;
  color: #ffc0dc;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.vinyl-wrap {
  display: grid;
  place-items: center;
  padding: 4px 0 24px;
}

.vinyl {
  position: relative;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  border: 5px solid #090909;
  background:
    radial-gradient(circle, transparent 0 16%, #242424 17% 18%,
      transparent 19% 27%, #292929 28% 29%,
      transparent 30% 38%, #252525 39% 40%,
      transparent 41% 49%, #282828 50% 51%,
      transparent 52% 60%, #252525 61% 62%,
      transparent 63% 70%, #252525 71% 72%,
      transparent 73%),
    repeating-radial-gradient(
      circle,
      #171717 0px,
      #303030 2px,
      #101010 4px,
      #242424 5px,
      #111 7px
    );
  box-shadow:
    0 0 0 3px rgba(255,120,183,.8),
    0 12px 28px rgba(0,0,0,.5);
}

.vinyl.spinning {
  animation: spin 4s linear infinite;
}

.record-label {
  position: absolute;
  inset: 50%;
  width: 76px;
  height: 76px;
  transform: translate(-50%, -50%);
  border: 3px solid #f6d6e6;
  border-radius: 50%;
  overflow: hidden;
  background: var(--pink);
}

.record-label img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.spindle {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 2;
  width: 7px;
  height: 7px;
  transform: translate(-50%, -50%);
  border: 1px solid #777;
  border-radius: 50%;
  background: #fff;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 0 0 18px;
  color: #ffd0e3;
  font-size: 12px;
  letter-spacing: 1.5px;
  font-weight: bold;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff5369;
  box-shadow: 0 0 10px rgba(255,83,105,.7);
}

.status-dot.playing {
  background: #57f5b0;
  box-shadow: 0 0 10px rgba(87,245,176,.7);
}

.controls {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 18px;
  background: rgba(2,15,37,.48);
}

.play {
  flex: 0 0 54px;
  width: 54px;
  height: 54px;
  border: 0;
  border-radius: 50%;
  background: var(--pink);
  color: white;
  font-size: 23px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,.24);
  transition: transform .2s, background .2s;
}

.play:hover {
  transform: scale(1.06);
  background: #f45da5;
}

.play:focus-visible,
.volume:focus-visible,
.mute:focus-visible {
  outline: 2px solid white;
  outline-offset: 4px;
}

.sound {
  flex: 1;
  min-width: 0;
  text-align: left;
}

.sound-title {
  font-size: 14px;
  font-weight: bold;
}

.sound-subtitle {
  margin-top: 5px;
  color: #cbd9f4;
  font-size: 11px;
}

.volume-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 13px;
}

.mute {
  padding: 2px;
  border: 0;
  color: white;
  background: transparent;
  cursor: pointer;
}

.volume {
  width: 100%;
  min-width: 50px;
  accent-color: var(--pink);
  cursor: pointer;
}

.web-button {
  display: inline-block;
  margin-top: 22px;
  padding: 14px 20px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 30px;
  background: var(--pink);
  color: white;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .4px;
  text-decoration: none;
  transition: transform .2s;
}

.web-button:hover {
  transform: translateY(-2px);
}

.footer {
  margin-top: 22px;
  color: rgba(255,255,255,.78);
  font-size: 12px;
  line-height: 1.7;
}

.footer strong { color: #ffc0dc; }

@media (max-width: 380px) {
  body { padding: 14px 8px; }
  .panel { padding: 22px 13px; }
  .vinyl { width: 165px; height: 165px; }
  .record-label { width: 68px; height: 68px; }
  .controls { gap: 9px; padding: 11px; }
  .play { flex-basis: 46px; width: 46px; height: 46px; }
}

@media (prefers-reduced-motion: reduce) {
  .vinyl.spinning { animation-duration: 20s; }
}
</style>
</head>

<body>
<main class="panel">

  <img class="logo" src="descarga.jpg"
       alt="Logo de Martina Radio">

  <h1>Martina Radio</h1>
  <p class="slogan">SIEMPRE PARA TI ❤️</p>

  <div class="vinyl-wrap">
    <div class="vinyl" id="vinyl">
      <div class="record-label">
        <img src="descarga.jpg" alt="">
      </div>
      <div class="spindle"></div>
    </div>
  </div>

  <div class="status" aria-live="polite">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">LISTA PARA SONAR</span>
  </div>

  <div class="controls">
    <button class="play" id="playButton"
            type="button" aria-label="Reproducir">
      ▶
    </button>

    <div class="sound">
      <div class="sound-title">En vivo desde Martina</div>
      <div class="sound-subtitle">Música y recuerdos de siempre</div>

      <div class="volume-row">
        <button class="mute" id="muteButton"
                type="button" aria-label="Silenciar">🔊</button>
        <input class="volume" id="volume"
               type="range" min="0" max="1" step="0.01"
               value="0.8" aria-label="Volumen">
      </div>
    </div>
  </div>

  <a class="web-button"
     href="https://sites.google.com/view/martinaradio/inicio"
     target="_blank" rel="noopener noreferrer">
    ENTRAR A LA WEB DE MARTINA RADIO
  </a>

  <footer class="footer">
    <strong>Martina Radio — Siempre Para Ti ❤️</strong><br>
    La música y los recuerdos de siempre.
  </footer>

  <audio id="audio" preload="none"
         src="https://radio.hazteunsitio.net/streams/martina_115f06">
  </audio>

</main>

<script>
(() => {
  const audio = document.getElementById("audio");
  const button = document.getElementById("playButton");
  const vinyl = document.getElementById("vinyl");
  const volume = document.getElementById("volume");
  const mute = document.getElementById("muteButton");
  const status = document.getElementById("statusText");
  const dot = document.getElementById("statusDot");

  audio.volume = 0.8;

  function setStatus(message, playing = false) {
    status.textContent = message;
    dot.classList.toggle("playing", playing);
  }

  function setPlaying(playing) {
    button.textContent = playing ? "Ⅱ" : "▶";
    button.setAttribute(
      "aria-label",
      playing ? "Pausar" : "Reproducir"
    );
    vinyl.classList.toggle("spinning", playing);

    if (playing) setStatus("EN VIVO", true);
  }

  button.addEventListener("click", async () => {
    if (!audio.paused) {
      audio.pause();
      return;
    }

    setStatus("CONECTANDO...");

    try {
      await audio.play();
    } catch (error) {
      setPlaying(false);
      setStatus("NO SE PUDO CONECTAR");
      console.error("Martina Radio:", error);
    }
  });

  volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
    audio.muted = false;
    mute.textContent = audio.volume === 0 ? "🔇" : "🔊";
  });

  mute.addEventListener("click", () => {
    audio.muted = !audio.muted;
    mute.textContent = audio.muted ? "🔇" : "🔊";
  });

  audio.addEventListener("playing", () => setPlaying(true));
  audio.addEventListener("pause", () => {
    setPlaying(false);
    setStatus("EN PAUSA");
  });

  audio.addEventListener("waiting", () =>
    setStatus("CARGANDO AUDIO...")
  );

  audio.addEventListener("error", () => {
    setPlaying(false);
    setStatus("ERROR DE TRANSMISIÓN");
  });

  audio.addEventListener("ended", () => {
    setPlaying(false);
    setStatus("TRANSMISIÓN FINALIZADA");
  });
})();
</script>
</body>
</html>
