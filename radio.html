
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123f83">
<title>Martina Radio — Siempre Para Ti</title>

<style>
:root {
  --azul: #123f83;
  --rosa: #ff78b7;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: white;
  background:
    linear-gradient(#071d43a8, #071d43a8),
    url("BANNER.png") center / cover fixed no-repeat,
    #102d56;
}

.panel {
  width: min(740px, 100%);
  padding: clamp(18px, 4vw, 32px);
  text-align: center;
  border-radius: 20px;
  border: 1px solid #ffffff45;
  background: linear-gradient(145deg, #164b96f5, #092654f5);
  box-shadow: 0 15px 40px #0006;
}

.logo {
  width: 125px;
  max-width: 45%;
  height: auto;
  object-fit: contain;
}

h1 {
  font-size: clamp(27px, 5vw, 38px);
  margin: 8px 0 3px;
}

.lema {
  color: #ffd3e8;
  font-weight: bold;
  letter-spacing: 2px;
  margin: 0 0 22px;
}

.etiqueta {
  display: inline-block;
  background: #ffffff20;
  border-radius: 30px;
  padding: 8px 13px;
  margin-bottom: 15px;
  font-size: 13px;
}

.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 12px;
  background: #061a36;
}

#player, #player iframe {
  width: 100%;
  height: 100%;
}

.controles {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  margin: 16px 0;
}

button {
  border: 0;
  border-radius: 25px;
  padding: 12px 16px;
  min-height: 43px;
  background: var(--rosa);
  color: #17233b;
  font-weight: bold;
  cursor: pointer;
}

button.secundario {
  background: #ffffff20;
  border: 1px solid #ffffff55;
  color: white;
}

.programacion {
  text-align: left;
  margin: 18px auto 0;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: #17345e;
  font-size: 16px;
}

#estado {
  min-height: 2.8em;
  line-height: 1.45;
  font-size: 14px;
  margin: 15px 0 0;
}

.nota, footer {
  font-size: 12px;
  line-height: 1.5;
  color: #d9e6ff;
}

footer { margin-top: 15px; }

@media (max-width: 480px) {
  body { padding: 10px 7px; background-attachment: scroll; }
  .panel { padding: 18px 12px; border-radius: 16px; }
  .controles { display: grid; grid-template-columns: 1fr 1fr; }
  button { width: 100%; padding: 11px 7px; }
}
</style>
</head>

<body>
<main class="panel">
  <img class="logo" src="descarga.jpg"
       alt="Martina Radio"
       onerror="this.style.display='none'">

  <h1>Martina Radio</h1>
  <p class="lema">SIEMPRE PARA TI ❤️</p>

  <div class="etiqueta">🎵 TU RADIO, TUS RECUERDOS</div>

  <div class="video">
    <div id="player"></div>
  </div>

  <div class="controles">
    <button id="reproducir">▶ Reproducir</button>
    <button id="pausar" class="secundario">Ⅱ Pausar</button>
    <button id="siguiente" class="secundario">⏭ Siguiente</button>
    <button id="silenciar" class="secundario">🔊 Silenciar</button>
  </div>

  <div class="programacion">
    <label for="listas">CAMBIAR PROGRAMACIÓN</label>
    <select id="listas" disabled>
      <option>Cargando programaciones...</option>
    </select>
  </div>

  <p id="estado" role="status">
    Preparando Martina Radio...
  </p>

  <p class="nota">
    La reproducción puede requerir que pulses Reproducir.
    Se necesita conexión a internet.
  </p>
</main>

<footer>Martina Radio · Siempre Para Ti ❤️</footer>

<script>
let reproductor;
let listo = false;
let programaciones = [];
let indice = 0;
let silenciado = false;

const listas = document.getElementById("listas");
const estado = document.getElementById("estado");

function informar(mensaje) {
  estado.textContent = mensaje;
}

function idValido(id) {
  return typeof id === "string" &&
    /^[A-Za-z0-9_-]{10,}$/.test(id) &&
    !/PON_AQUI|REEMPLAZAR|EJEMPLO/i.test(id);
}

async function cargarProgramaciones() {
  try {
    const respuesta = await fetch("playlist.json?actualizar=" + Date.now());

    if (!respuesta.ok) {
      throw new Error("No se encontró playlist.json");
    }

    const datos = await respuesta.json();

    programaciones = Array.isArray(datos.programaciones)
      ? datos.programaciones
      : [];

    listas.innerHTML = "";

    programaciones.forEach((p, i) => {
      const opcion = document.createElement("option");
      opcion.value = i;
      opcion.textContent = p.nombre;
      listas.appendChild(opcion);
    });

    if (!programaciones.some(p => idValido(p.playlistId))) {
      listas.disabled = true;
      listas.innerHTML =
        '<option>Faltan los ID de YouTube</option>';

      informar("La página está preparada. Falta introducir los ID reales de tus playlists en playlist.json.");
      return;
    }

    indice = Math.max(
      0,
      Math.min(datos.programacionInicial || 0,
               programaciones.length - 1)
    );

    listas.value = indice;
    listas.disabled = false;

    if (listo) seleccionarLista(false);

  } catch (error) {
    listas.innerHTML =
      '<option>No se pudo cargar la programación</option>';

    informar("No se pudo leer playlist.json. Comprueba que esté junto a radio.html en GitHub.");
  }
}

function seleccionarLista(reproducir) {
  const p = programaciones[indice];

  if (!listo || !p || !idValido(p.playlistId)) {
    informar("Esta programación necesita un ID válido de YouTube.");
    return;
  }

  reproductor.loadPlaylist({
    listType: "playlist",
    list: p.playlistId,
    index: 0
  });

  if (reproducir) reproductor.playVideo();

  informar("Programación: " + p.nombre +
           ". Pulsa Reproducir para escuchar.");
}

window.onYouTubeIframeAPIReady = function() {
  reproductor = new YT.Player("player", {
    width: "100%",
    height: "100%",
    playerVars: {
      playsinline: 1,
      rel: 0
    },
    events: {
      onReady: function() {
        listo = true;

        if (programaciones.length) {
          seleccionarLista(false);
        } else {
          informar("Reproductor listo. Configura tus playlists.");
        }
      },
      onStateChange: function(evento) {
        if (evento.data === YT.PlayerState.PLAYING) {
          informar("Sonando en Martina Radio: " +
            (programaciones[indice]?.nombre || "Música"));
        }
      },
      onError: function(evento) {
        informar("YouTube no pudo reproducir esta playlist. Revisa su ID y que permita reproducción incrustada. Código: " + evento.data);
      }
    }
  });
};

listas.addEventListener("change", function() {
  indice = Number(this.value);
  seleccionarLista(false);
});

document.getElementById("reproducir").onclick = function() {
  if (!listo) {
    informar("El reproductor aún está cargando. Intenta nuevamente.");
    return;
  }

  const p = programaciones[indice];

  if (!p || !idValido(p.playlistId)) {
    informar("Primero configura una playlist real de YouTube.");
    return;
  }

  const actual = reproductor.getPlaylist();

  if (actual && actual.length) {
    reproductor.playVideo();
  } else {
    seleccionarLista(true);
  }
};

document.getElementById("pausar").onclick = function() {
  if (listo) reproductor.pauseVideo();
};

document.getElementById("siguiente").onclick = function() {
  if (listo) reproductor.nextVideo();
};

document.getElementById("silenciar").onclick = function() {
  if (!listo) return;

  silenciado = !silenciado;

  if (silenciado) {
    reproductor.mute();
  } else {
    reproductor.unMute();
  }

  this.textContent = silenciado
    ? "🔇 Activar sonido"
    : "🔊 Silenciar";
};

cargarProgramaciones();

const api = document.createElement("script");
api.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(api);
</script>
</body>
</html>
