
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123f83">
<title>Martina Radio — Siempre Para Ti</title>
<style>
:root {
  --blue: #123f83;
  --pink: #ff78b7;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 18px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: white;
  background:
    linear-gradient(#061b3db8, #061b3db8),
    url("BANNER.png") center / cover fixed no-repeat,
    #102d56;
}

.panel {
  width: min(620px, 100%);
  text-align: center;
  padding: 24px clamp(14px, 4vw, 30px);
  border-radius: 22px;
  border: 1px solid #ffffff45;
  background: linear-gradient(145deg, #164b96f5, #092654f5);
  box-shadow: 0 16px 42px #0007;
}

.logo {
  width: 100px;
  height: 100px;
  object-fit: contain;
}

h1 {
  font-size: clamp(28px, 6vw, 38px);
  margin: 7px 0 3px;
}

.tagline {
  color: #ffd3e8;
  font-weight: bold;
  letter-spacing: 2px;
  margin: 0 0 20px;
}

.vinyl-area {
  display: flex;
  justify-content: center;
  margin: 15px 0 20px;
}

.vinyl {
  width: clamp(155px, 43vw, 220px);
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    repeating-radial-gradient(
      circle at center,
      #17191e 0px,
      #252830 2px,
      #101115 4px,
      #30323a 5px,
      #101115 7px
    );
  border: 5px solid #08090d;
  box-shadow: 0 8px 18px #0008;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.vinyl::after {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  border: 1px solid #ffffff16;
}

.vinyl.playing {
  animation: spin 3.5s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.record-label {
  width: 39%;
  height: 39%;
  border-radius: 50%;
  overflow: hidden;
  background: #f4b8d4;
  border: 4px solid #e8d5e0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.record-label img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.track-title {
  font-weight: bold;
  margin: 8px 0 14px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  margin: 14px 0;
}

button {
  border: 0;
  border-radius: 25px;
  padding: 12px 17px;
  min-height: 43px;
  color: #17233b;
  background: var(--pink);
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #ffffff20;
  color: white;
  border: 1px solid #ffffff45;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 15px 0;
  font-size: 12px;
  color: #e2eaff;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--pink);
  cursor: pointer;
}

.program {
  text-align: left;
  margin-top: 22px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  color: #17345e;
  background: white;
}

#status {
  min-height: 2.8em;
  font-size: 13px;
  line-height: 1.5;
  color: #e3eaff;
  margin: 13px 0;
}

.youtube-box {
  width: 320px;
  max-width: 100%;
  min-height: 200px;
  margin: 20px auto 0;
  border-radius: 10px;
  overflow: hidden;
  background: #050b16;
}

#ytplayer {
  width: 100%;
  height: 200px;
}

.note, footer {
  color: #d4e0f9;
  font-size: 11px;
  line-height: 1.5;
}

footer { margin-top: 14px; }

@media (max-width: 420px) {
  body { padding: 8px 5px; background-attachment: scroll; }
  .panel { padding: 17px 11px; border-radius: 16px; }
  .controls { gap: 7px; }
  button { padding: 11px 10px; }
}
</style>
</head>

<body>
<main class="panel">
  <img class="logo" src="descarga.jpg" alt="Martina Radio"
       onerror="this.style.display='none'">

  <h1>Martina Radio</h1>
  <p class="tagline">SIEMPRE PARA TI ❤️</p>

  <div class="vinyl-area">
    <div class="vinyl" id="vinyl">
      <div class="record-label">
        <img src="descarga.jpg" alt="Etiqueta Martina Radio">
      </div>
    </div>
  </div>

  <div class="track-title" id="trackTitle">
    Siempre Para Ti
  </div>

  <div class="controls">
    <button id="play">▶ Reproducir</button>
    <button id="pause" class="secondary">Ⅱ Pausar</button>
    <button id="next" class="secondary">⏭ Siguiente</button>
  </div>

  <div class="progress-row">
    <span id="elapsed">0:00</span>
    <input id="progress" type="range" min="0" max="1000"
           value="0" aria-label="Progreso de la canción">
    <span id="duration">0:00</span>
  </div>

  <div class="program">
    <label for="playlist">CAMBIAR PROGRAMACIÓN</label>
    <select id="playlist" disabled>
      <option>Cargando programaciones...</option>
    </select>
  </div>

  <p id="status" role="status">
    Preparando Martina Radio...
  </p>

  <div class="youtube-box">
    <div id="ytplayer"></div>
  </div>

  <p class="note">
    La reproducción utiliza YouTube. El video permanece visible
    en el reproductor oficial.
  </p>
</main>

<footer>Martina Radio · Siempre Para Ti ❤️</footer>

<script>
let player;
let ready = false;
let programs = [];
let currentIndex = 0;
let dragging = false;

const selector = document.getElementById("playlist");
const status = document.getElementById("status");
const vinyl = document.getElementById("vinyl");
const progress = document.getElementById("progress");

function say(message) {
  status.textContent = message;
}

function validId(id) {
  return typeof id === "string" &&
    /^[A-Za-z0-9_-]{10,}$/.test(id) &&
    !/PON_AQUI|REEMPLAZAR|EJEMPLO/i.test(id);
}

function clock(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const s = Math.floor(seconds);
  return Math.floor(s / 60) + ":" +
    String(s % 60).padStart(2, "0");
}

async function loadConfig() {
  try {
    const response = await fetch("playlist.json?cache=" + Date.now());
    if (!response.ok) throw new Error();

    const config = await response.json();
    programs = Array.isArray(config.programaciones)
      ? config.programaciones : [];

    selector.innerHTML = "";

    programs.forEach((item, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = item.nombre;
      selector.appendChild(option);
    });

    if (!programs.some(p => validId(p.playlistId))) {
      selector.disabled = true;
      say("Faltan los ID reales de las playlists en playlist.json.");
      return;
    }

    currentIndex = Math.max(0, Math.min(
      Number(config.programacionInicial) || 0,
      programs.length - 1
    ));

    selector.value = currentIndex;
    selector.disabled = false;

    if (ready) choosePlaylist(false);
  } catch (error) {
    say("No se pudo leer playlist.json. Comprueba que esté junto a radio.html.");
  }
}

function choosePlaylist(autoplay) {
  const item = programs[currentIndex];

  if (!ready || !item || !validId(item.playlistId)) {
    say("Esta sección todavía no tiene una playlist válida.");
    return;
  }

  player.loadPlaylist({
    listType: "playlist",
    list: item.playlistId,
    index: 0
  });

  document.getElementById("trackTitle").textContent = item.nombre;
  say("Programación: " + item.nombre);

  if (autoplay) player.playVideo();
}

window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player("ytplayer", {
    width: "320",
    height: "200",
    playerVars: {
      playsinline: 1,
      controls: 1,
      rel: 0
    },
    events: {
      onReady: function() {
        ready = true;
        if (programs.length) choosePlaylist(false);
        else say("Reproductor listo. Configura tus playlists.");
      },
      onStateChange: function(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          vinyl.classList.add("playing");
          say("Sonando en Martina Radio");
          updateProgress();
        } else {
          vinyl.classList.remove("playing");
        }
      },
      onError: function(event) {
        vinyl.classList.remove("playing");
        say("YouTube no pudo reproducir esta playlist. Revisa el ID o los permisos. Código: " + event.data);
      }
    }
  });
};

selector.addEventListener("change", function() {
  currentIndex = Number(this.value);
  choosePlaylist(false);
});

document.getElementById("play").onclick = function() {
  if (!ready) return say("YouTube todavía está cargando.");

  const item = programs[currentIndex];
  if (!item || !validId(item.playlistId)) {
    return say("Configura un ID real en playlist.json.");
  }

  const current = player.getPlaylist();
  if (current && current.length) {
    player.playVideo();
  } else {
    choosePlaylist(true);
  }
};

document.getElementById("pause").onclick = function() {
  if (ready) player.pauseVideo();
};

document.getElementById("next").onclick = function() {
  if (ready) player.nextVideo();
};

progress.addEventListener("input", function() {
  dragging = true;
});

progress.addEventListener("change", function() {
  if (ready && player.getDuration() > 0) {
    player.seekTo((Number(this.value) / 1000) * player.getDuration(), true);
  }
  dragging = false;
});

function updateProgress() {
  if (!ready) return;

  const state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING) {
    const duration = player.getDuration();
    const elapsed = player.getCurrentTime();

    if (!dragging && duration > 0) {
      progress.value = Math.round(elapsed / duration * 1000);
    }

    document.getElementById("elapsed").textContent = clock(elapsed);
    document.getElementById("duration").textContent = clock(duration);
  }

  window.setTimeout(updateProgress, 1000);
}

loadConfig();

const script = document.createElement("script");
script.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(script);
</script>
</body>
</html>
